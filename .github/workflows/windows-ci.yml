name: Windows CI

on:
  push:
  pull_request:

# Read-only by default. The job checks out, tests and builds; it publishes
# nothing and comments nowhere, so the token it is handed should not be able to.
permissions:
  contents: read

# A release here is often several pushes in a few minutes, and each one used to
# start a seven-minute run while the previous one was still going. Only the
# newest commit on a branch is worth verifying; the older runs are answering a
# question nobody is asking any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    # A hung Pester run or a wedged dotnet restore should not hold a runner for
    # the six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis and test modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The runner image decides which package system is present, and it
          # changed underneath this workflow: newer Windows images ship
          # PSResourceGet, and PowerShellGet v2's repository list can come up
          # empty - so "Set-PSRepository PSGallery" died with "No repository
          # with the name 'PSGallery' was found" before a single test ran.
          # Whichever is there is used, and PSGallery is registered rather than
          # assumed.
          if (Get-Command Install-PSResource -ErrorAction SilentlyContinue) {
            Install-PSResource PSScriptAnalyzer -Scope CurrentUser -TrustRepository
            Install-PSResource Pester -Version '[5.0,5.9.9]' -Scope CurrentUser -TrustRepository -SkipDependencyCheck
          }
          else {
            if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default }
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
            Install-Module Pester -MinimumVersion 5.0 -MaximumVersion 5.9.9 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          # Said out loud: a gate that cannot name the versions it ran is a gate
          # whose failures cannot be reproduced.
          Get-Module -ListAvailable Pester, PSScriptAnalyzer |
            Sort-Object Name, Version |
            ForEach-Object { "installed: $($_.Name) $($_.Version)" }
      - name: Run parser, analyzer, and tests
        shell: pwsh
        run: .\Run-Checks.ps1 -TestResultPath .\artifacts\pester-results.xml
      - name: Verify managed service lifecycle
        shell: pwsh
        run: .\scripts\Test-ServiceLifecycle.ps1
      # The control app was never compiled here, so a C# build error - or a
      # broken SelfTest - reached main with the gate green, and the only thing
      # standing between the two was a developer remembering to run
      # Build-BridgeManager.ps1 by hand. The publish also runs --selftest and
      # throws on a non-zero exit, which is the only test framework this app has.
      - name: Build and self-test the control app
        shell: pwsh
        run: .\scripts\Build-BridgeManager.ps1 -OutputDirectory .\artifacts\BridgeManager
      - name: Build allow-listed release package
        shell: pwsh
        run: .\Build-Release.ps1 -SkipChecks -OutputDirectory .\artifacts\release
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-verification
          path: artifacts/
